apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-api-service-books
  namespace: bookstore-ns
spec:
  selector:
    matchLabels:
      app: bookstore-api-service-books
  replicas: 1
  template:
    metadata:
      labels:
        app: bookstore-api-service-books
    spec:
      containers:
        - name: bookstore-api-service-books
          image: soobinrho/17647-bookstore-api-service-books:latest
          imagePullPolicy: Always
          terminationMessagePath: "/tmp/k8s_termination_message.log"
          ports:
          - containerPort: 3000
          stdin: true
          envFrom:
            - secretRef:
                name: secrets-api-service-books
          # [DEBUG] Disabling livenessprobe until the infinite error crash loop gets resolved.
          # livenessProbe:
          #   httpGet:
          #     path: /status
          #     port: 3000
          #   initialDelaySeconds: 600
          #   periodSeconds: 30
          #   failureThreshold: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                      - bookstore-api-service-books
