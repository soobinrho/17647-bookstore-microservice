apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-bff-desktop
  namespace: bookstore-ns
spec:
  selector:
    matchLabels:
      app: bookstore-bff-desktop
  replicas: 2
  template:
    metadata:
      labels:
        app: bookstore-bff-desktop
    spec:
      containers:
        - name: bookstore-bff-desktop
          image: soobinrho/17647-bookstore-bff-desktop:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          livenessProbe:
            httpGet:
              path: /status
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                      - bookstore-crm-service-customers
